<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Student Registration Form</title>
</head>

<body>

<center>

    <img src="saylani_logo-removebg-preview.png" class="logo">

    <h1>Saylani Online Academy</h1>
    <br><br>

    <!-- ONLY ONE FORM -->
    <form action="success.html" method="GET">

        <table bgcolor="lightgrey">
            <tr>
                <td colspan="2" align="center"><b>Student Registration Form</b></td>
            </tr>

            <tr>
                <td>Name:</td>
                <td><input type="text" placeholder="Enter Your Name" required style="width:200px; height:25px;"></td>
            </tr>

            <tr>
                <td>Father Name:</td>
                <td><input type="text" placeholder="Enter Your Father Name" required style="width:200px; height:25px;"></td>
            </tr>

            <tr>
                <td>Password:</td>
                <td><input type="password" placeholder="Enter Your Password" required style="width:200px; height:25px;"></td>
            </tr>

            <tr>
                <td>Address:</td>
                <td><textarea rows="5" cols="30" placeholder="Address"></textarea></td>
            </tr>

            <tr>
                <td>Gender:</td>
                <td>
                    <input type="radio" name="gender">Male
                    <input type="radio" name="gender">Female
                </td>
            </tr>

            <tr>
                <td>Language:</td>
                <td>
                    <input type="checkbox">Urdu
                    <input type="checkbox">English
                    <input type="checkbox">Arabic
                    <input type="checkbox">Chinese
                </td>
            </tr>

            <tr>
                <td>Date of birth:</td>
                <td><input type="date"></td>
            </tr>

            <tr>
                <td>Email ID:</td>
                <td><input type="email" placeholder="Enter Your Email" required style="width:200px; height:25px;"></td>
            </tr>

            <tr>
                <td>Mobile Number:</td>
                <td><input type="number" placeholder="Enter Your Mobile Number" required style="width:200px; height:25px;"></td>
            </tr>

            <tr>
                <td>Country:</td>
                <td>
                    <select style="width:200px; height:25px;">
                        <option selected disabled>Select Country</option>
                        <option>PAKISTAN</option>
                        <option>CHINA</option>
                        <option>INDIA</option>
                        <option>IRAN</option>
                        <option>IRAQ</option>
                    </select>
                </td>
            </tr>

            <tr>
                <td>Hobbies:</td>
                <td>
                    <select style="width:200px; height:25px;">
                        <option selected disabled>Hobbies</option>
                        <option>CRICKET</option>
                        <option>RIDING</option>
                        <option>BOXING</option>
                        <option>READING</option>
                        <option>GYM</option>
                    </select>
                </td>
            </tr>

            <tr>
                <td>Choose File:</td>
                <td><input type="file" accept="image/*"></td>
            </tr>

            <tr>
                <td></td>
                <td><input type="submit" value="Submit Form"></td>
            </tr>

        </table>

    </form>

</center>

</body>
</html>
